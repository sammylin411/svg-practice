<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#e8f4f8"/>
  <circle cx="650" cy="100" r="50" fill="#ffe680"/>
  <ellipse cx="400" cy="540" rx="320" ry="20" fill="#cdeac0"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="6" fill="none">
    <circle cx="250" cy="450" r="60"/>
    <circle cx="550" cy="450" r="60"/>
    <path d="M250 450 L370 450 L440 300 L320 300 Z"/>
    <path d="M370 450 L440 300"/>
    <path d="M440 300 L550 450"/>
    <path d="M320 300 L300 260"/>
    <path d="M280 260 L330 260"/>
    <path d="M440 300 L430 250"/>
    <path d="M410 250 L470 250"/>
    <path d="M250 450 L210 450 L210 430"/>
  </g>
  <circle cx="370" cy="450" r="12" fill="#333"/>
  <path d="M370 450 L350 485 M370 450 L390 485" stroke="#333" stroke-width="5"/>

  <!-- Pelican body -->
  <ellipse cx="380" cy="290" rx="70" ry="45" fill="#f5f5f0" stroke="#333" stroke-width="3"/>
  <!-- Wing -->
  <path d="M360 270 Q400 230 430 280 Q400 290 360 270" fill="#ddddd5" stroke="#333" stroke-width="3"/>
  <!-- Neck -->
  <path d="M330 270 Q310 220 330 180" stroke="#f5f5f0" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="335" cy="170" r="22" fill="#f5f5f0" stroke="#333" stroke-width="3"/>
  <!-- Beak -->
  <path d="M355 165 L430 175 Q440 195 425 200 L355 185 Z" fill="#f4c26b" stroke="#333" stroke-width="3"/>
  <path d="M355 185 Q400 210 425 200" fill="#e8b04b" stroke="#333" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="342" cy="164" r="4" fill="#333"/>
  <!-- Legs -->
  <path d="M360 330 L355 400 L370 485" stroke="#f4c26b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M400 330 L420 400 L390 485" stroke="#f4c26b" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
