<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#eaf6fb"/>
  <!-- Mountains -->
  <path d="M0 380 L140 220 L260 380 Z" fill="#a8c8d8"/>
  <path d="M140 220 L185 275 L140 290 L95 272 Z" fill="#ffffff"/>
  <path d="M180 380 L360 180 L540 380 Z" fill="#8fb4c7"/>
  <path d="M360 180 L415 250 L360 268 L305 248 Z" fill="#ffffff"/>
  <path d="M460 380 L620 230 L780 380 Z" fill="#a8c8d8"/>
  <!-- Ground -->
  <rect y="380" width="800" height="220" fill="#b5d99c"/>
  <rect y="372" width="800" height="14" fill="#8fc178"/>
  <rect y="470" width="800" height="10" fill="#ffffff" opacity="0.7"/>

  <!-- Bicycle (road bike, drop handlebars) -->
  <g stroke="#c0392b" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="250" cy="450" r="58"/>
    <circle cx="550" cy="450" r="58"/>
    <path d="M250 450 L365 450 L438 302 L325 302 Z"/>
    <path d="M365 450 L438 302"/>
    <path d="M438 302 L550 450"/>
    <path d="M325 302 L308 262"/>
  </g>
  <!-- Drop handlebars -->
  <path d="M308 262 L340 262 Q352 262 352 274 Q352 288 340 286" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Saddle -->
  <path d="M418 256 L464 256" stroke="#333" stroke-width="9" stroke-linecap="round"/>
  <path d="M438 302 L440 258" stroke="#333" stroke-width="5"/>
  <!-- Crank + pedals -->
  <circle cx="365" cy="450" r="12" fill="#333"/>
  <path d="M365 450 L344 485 M365 450 L386 415" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <circle cx="344" cy="485" r="7" fill="#333"/>
  <circle cx="386" cy="415" r="7" fill="#333"/>

  <!-- Pelican leaning forward (racing pose) -->
  <ellipse cx="400" cy="290" rx="78" ry="44" fill="#ffffff" stroke="#333" stroke-width="3" transform="rotate(-12 400 290)"/>
  <!-- Tail -->
  <path d="M328 300 Q300 288 285 300 Q306 310 330 310" fill="#e3e3e3" stroke="#333" stroke-width="3"/>
  <!-- Wing swept back -->
  <path d="M380 272 Q430 240 470 278 Q424 292 380 272" fill="#e3e3e3" stroke="#333" stroke-width="3"/>
  <path d="M396 264 Q426 254 448 272" stroke="#c2c2c2" stroke-width="3" fill="none"/>
  <!-- Neck stretched forward -->
  <path d="M452 268 Q492 240 512 200" stroke="#ffffff" stroke-width="19" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="518" cy="192" r="22" fill="#ffffff" stroke="#333" stroke-width="3"/>
  <!-- Racing helmet -->
  <path d="M496 186 Q498 160 522 158 Q544 160 544 186 Q530 174 518 178 Q506 180 496 186 Z" fill="#2980b9" stroke="#333" stroke-width="3"/>
  <path d="M522 176 L522 158" stroke="#333" stroke-width="3"/>
  <!-- Long beak pointing forward -->
  <path d="M536 184 L622 194 Q634 212 618 218 L536 202 Z" fill="#f5a623" stroke="#333" stroke-width="3"/>
  <path d="M536 202 Q588 230 618 218" fill="#e08e0b" stroke="#333" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="524" cy="186" r="4.5" fill="#333"/>
  <!-- Legs to pedals -->
  <path d="M380 322 L360 390 L344 485" stroke="#f5a623" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M414 326 L410 370 L386 415" stroke="#f5a623" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Arms/wings to handlebars -->
  <path d="M448 282 Q400 300 344 268" stroke="#ffffff" stroke-width="13" fill="none" stroke-linecap="round"/>
  <circle cx="340" cy="266" r="8" fill="#f5a623" stroke="#333" stroke-width="2.5"/>

  <!-- Speed lines -->
  <g stroke="#8fb4c7" stroke-width="5" stroke-linecap="round">
    <path d="M60 300 L170 300"/>
    <path d="M40 350 L130 350"/>
    <path d="M75 400 L175 400"/>
  </g>
</svg>
